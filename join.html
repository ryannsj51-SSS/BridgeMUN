<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logn MUN | Join</title>
    <style>
      /* Matches the same colors, spacing, and typeface as the rest of
         the site (see delegate.html) so this feels like one site, not
         a separate login screen bolted on. */
      :root {
        color: #14233b;
        background: #e8edf4;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 56px 20px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(rgb(255 255 255 / 70%), rgb(255 255 255 / 70%)),
          linear-gradient(90deg, rgb(31 75 153 / 6%) 1px, transparent 1px),
          linear-gradient(rgb(31 75 153 / 6%) 1px, transparent 1px),
          #e8edf4;
        background-size: auto, 36px 36px, 36px 36px, auto;
      }

      main {
        width: 100%;
        max-width: 480px;
      }

      .card {
        padding: clamp(28px, 6vw, 44px);
        background: rgb(255 255 255 / 94%);
        border: 1px solid #d6dfeb;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgb(20 35 59 / 9%);
        text-align: center;
      }

      .label {
        margin: 0 0 4px;
        color: #52617c;
        font-size: 0.85rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.7rem;
      }

      .subtitle {
        margin: 0 0 32px;
        color: #384965;
      }

      .role-buttons {
        display: grid;
        gap: 14px;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      /* Shared base look for both role buttons -- the chair one is
         picked out with a filled background below. */
      .role-button {
        padding: 16px 18px;
        border-radius: 10px;
        font-weight: bold;
        font-size: 1rem;
      }

      .chair-button {
        color: #ffffff;
        background: #1f4b99;
        border: 1px solid #1f4b99;
      }

      .chair-button:hover {
        background: #163a7a;
      }

      .delegate-button {
        color: #1f4b99;
        background: #ffffff;
        border: 1px solid #1f4b99;
      }

      .delegate-button:hover {
        color: #ffffff;
        background: #1f4b99;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .role-hint {
        margin: 6px 0 0;
        color: #52617c;
        font-size: 0.85rem;
      }

      .chair-status {
        min-height: 1.25em;
        margin: 14px 0 0;
        color: #b3261e;
        font-size: 0.9rem;
      }

      .back-link {
        display: inline-block;
        margin-top: 18px;
        color: #52617c;
        font-size: 0.9rem;
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      @media (max-width: 420px) {
        .card {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="landing-heading">
        <p class="label">Logn MUN</p>
        <h1 id="landing-heading">Join a Committee</h1>
        <p class="subtitle">Choose how you're joining this session.</p>

        <div class="role-buttons">
          <div>
            <!-- Opens a Google sign-in popup; only one specific Google
                 account is allowed through to the chair dashboard (see
                 landing.js and chair.js). Anyone else is sent back here
                 with an explanation. -->
            <button class="role-button chair-button" id="chair-button" type="button">
              Sign in as Chair (Google)
            </button>
            <p class="role-hint">For the one person running this committee. You'll get a meeting code to share.</p>
          </div>
          <div>
            <!-- No sign-in needed beyond the anonymous identity the
                 delegate page already creates for itself -- clicking
                 this moves on to entering the meeting code next. -->
            <button class="role-button delegate-button" id="delegate-button" type="button">
              Join as Delegate
            </button>
            <p class="role-hint">You'll need the 6-digit meeting code your chair shared.</p>
          </div>
        </div>

        <p class="chair-status" id="chair-status" aria-live="polite"></p>
        <a class="back-link" href="index.html">← Back</a>
      </section>
    </main>
    <script type="module" src="landing.js"></script>
  </body>
</html>
